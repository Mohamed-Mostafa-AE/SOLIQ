services:
  - type: web
    name: soliq-web
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: HOST=0.0.0.0 node dev-server.mjs
    healthCheckPath: /welcome/
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
