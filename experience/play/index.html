<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#163e35">
  <title>Soil-IQ · The Seventh Field · 3D World</title>
  <link rel="icon" href="../../soliq-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Loading Splash Screen -->
  <div id="game-loader" class="game-loader">
    <div class="loader-content">
      <img src="../../soliq-logo.svg" alt="Soil-IQ logo" class="loader-logo">
      <h2 class="loader-title">The Seventh Field · A Living World</h2>
      <p class="loader-sub">Preparing the Nile Delta village and water systems...</p>
      <div class="loader-progress-bar"><div id="loader-bar" class="loader-bar"></div></div>
      <button id="btn-start-game" class="btn-start" hidden>Enter the Village · Begin Mission 🌾</button>
      <p class="loader-note">A fictional village powered by transparent canal-water calculations, not live field measurements.</p>
      <p class="loader-note"><a href="story.html" id="text-story-entry">Play the text-first story (keyboard, screen reader, captions) →</a></p>
    </div>
  </div>

  <!-- 3D WebGL Canvas -->
  <canvas id="renderCanvas" touch-action="none" tabindex="0" aria-label="The Seventh Field interactive 3D world. Use the text-first story link for a non-spatial alternative."></canvas>

  <!-- In-Game UI Layer -->
  <div id="game-ui-container"></div>

  <!-- Fallback Babylon Scripts (Local Vendored with CDN Fallback) -->
  <script src="../../game/assets/vendor/babylon.js"></script>
  <script src="../../game/assets/vendor/babylonjs.loaders.min.js"></script>
  <script>
    if (typeof BABYLON === 'undefined') {
      document.write('<script src="https://cdn.babylonjs.com/babylon.js"><\\/script>');
      document.write('<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"><\\/script>');
    }
  </script>

  <!-- Main Game Orchestrator Script -->
  <script type="module" src="main.js"></script>
</body>
</html>
