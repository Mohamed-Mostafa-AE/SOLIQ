<style>
:root{color-scheme:dark;--ink:#10271f;--deep:#081a15;--paper:#eff3e4;--green:#c0d794;--muted:#b5c2b2;--gold:#d6ad64;--line:#98ae8d38;--panel:#183329}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--deep);color:var(--paper);font:16px/1.5 Arial,Helvetica,sans-serif}
body{min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
button,a{touch-action:manipulation}button{font:inherit;color:inherit;border:1px solid var(--line);background:transparent;padding:9px 13px;border-radius:5px;cursor:pointer}
button:hover,button:focus-visible{background:#c0d79422;outline:2px solid #c0d79488;outline-offset:2px}button:disabled{opacity:.35;cursor:default}a{color:inherit}
.toolbar{height:76px;flex:none;padding:14px clamp(16px,3vw,42px);display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--line);background:#081a15}

.tools{margin-left:auto;display:flex;gap:8px;font-size:12px}.tools button{white-space:nowrap}
kbd{font:10px Arial;margin-left:4px;opacity:.6}
main{width:100%;flex:1;display:flex;align-items:stretch;justify-content:center;padding:clamp(10px,2vw,26px)}
#stage{position:relative;width:min(100%,1440px);min-height:calc(100svh - 158px);background:radial-gradient(ellipse at 82% 48%,#2c453160,transparent 62%),var(--ink);box-shadow:0 30px 100px #0005;overflow:hidden;border:1px solid #ffffff08}

@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.overline{font-size:12px;letter-spacing:3px;color:var(--green);margin:0 0 24px;text-transform:uppercase}
h1{font:400 clamp(42px,6.4vw,82px)/1.04 Georgia,serif;letter-spacing:-2px;margin:0 0 22px;white-space:pre-line;max-width:950px}
.lead{font-size:clamp(17px,2vw,23px);line-height:1.45;white-space:pre-line;color:#c7d0c0;margin:0;max-width:720px}
.hero .copy{position:relative;z-index:2;padding-top:clamp(20px,7vh,74px);max-width:570px}
.hero h1{font-size:clamp(56px,7.5vw,96px)}
.tagline{margin-top:36px;display:inline-block;font-size:12px;letter-spacing:2px;color:var(--gold);border-top:1px solid var(--line);padding-top:18px}

.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.9fr);gap:clamp(24px,5vw,70px);align-items:center}
.problem .two-col{grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr)}
.need-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;margin-top:28px;max-width:620px}
.need{padding-top:12px;border-top:1px solid #bdd39b55}.need b{font-size:20px;color:var(--green);font-weight:500}.need p{font-size:16px;line-height:1.45;margin:7px 0 0;color:#cbd5c5}
.section-head{max-width:900px}.section-head h1{font-size:clamp(42px,5.6vw,68px)}
.rotation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:42px}
.rotation{position:relative;min-height:220px;padding:24px;background:#d5e3bd0a;border-top:2px solid var(--green);box-shadow:10px 12px 0 #071a1440;transform:perspective(1000px) rotateY(-2deg)}
.rotation:nth-child(2){transform:translateY(-8px)}.rotation:nth-child(3){transform:perspective(1000px) rotateY(2deg)}
.rotation small{font-size:12px;color:var(--gold);letter-spacing:1px}.rotation h2{font-size:24px;font-weight:400;margin:24px 0 12px}.rotation p{font-size:17px;line-height:1.45;color:#c8d2c1;max-width:290px}
.mini-line{display:flex;gap:5px;position:absolute;left:24px;right:24px;bottom:20px;height:7px}.mini-line i{flex:1;background:var(--green);opacity:.6}.mini-line i:nth-child(3n){background:var(--gold)}
.aside-line{font-size:14px;margin-top:26px;color:var(--green)}
.evidence-grid{display:grid;gap:17px;margin-top:32px;max-width:760px}.step{border-left:2px solid var(--green);padding-left:18px}.step h2{margin:0 0 7px;font-size:20px;font-weight:400;color:var(--green)}.step p{margin:0;font-size:17px;line-height:1.45;color:#cbd5c5}
.ai-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.75fr);gap:30px;align-items:center}.ai-stat{padding:32px;border:1px solid #c0d79466;background:#152d24f5;box-shadow:16px 18px 0 #06170f4d;transform:perspective(900px) rotateY(-5deg);max-width:390px}
.ai-stat strong{font:400 clamp(65px,8vw,92px)/1 Georgia,serif;color:var(--green)}.ai-stat p{font-size:20px;line-height:1.4}.ai-stat small{font-size:12px;color:var(--muted);line-height:1.5;display:block}
.text-link{display:inline-block;margin-top:22px;font-size:16px;color:var(--green);text-decoration:underline;text-underline-offset:5px}
.benchmark .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:34px;max-width:900px}
.stat{padding-top:14px;border-top:2px solid var(--green)}.stat strong{font:400 clamp(38px,5vw,58px)/1 Georgia,serif;white-space:nowrap;letter-spacing:-2px}.stat p{font-size:16px;max-width:190px;line-height:1.4;color:#ced7c7}
.check-line{font-size:14px;color:var(--green);margin-top:25px;max-width:760px;line-height:1.55}
.benchmark-note{font-size:12px;color:#b8c6af;max-width:900px;line-height:1.55;margin-top:16px}
.close .close-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:34px;max-width:940px}
.close .step{padding-left:13px}.close .step p{font-size:15px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;position:relative;z-index:3}
.actions a{padding:11px 16px;border:1px solid #bfd79499;text-decoration:none;font-size:14px;color:var(--green);display:inline-flex;align-items:center;gap:8px}
.actions a.primary{background:var(--green);color:var(--ink)}
.authors{font-size:13px;color:#c5d0bd;margin-top:20px;max-width:820px;line-height:1.6}
.slide-footer{position:absolute;left:clamp(26px,4.5vw,64px);right:clamp(26px,4.5vw,64px);bottom:18px;display:flex;justify-content:space-between;gap:14px;color:#aabb9f;font-size:10px;border-top:1px solid var(--line);padding-top:10px;pointer-events:none}
.controls{height:66px;flex:none;padding:10px clamp(16px,3vw,42px);display:flex;align-items:center;gap:15px;border-top:1px solid var(--line);background:#081a15}
#slide-nav{display:flex;gap:7px;flex-wrap:wrap}#slide-nav button{width:24px;height:24px;padding:0;border-radius:50%;font-size:10px;color:var(--muted)}
#slide-nav button[aria-pressed="true"]{background:var(--green);color:var(--ink);border-color:var(--green)}
#counter{font-size:12px;min-width:44px;font-variant-numeric:tabular-nums}.hint{font-size:11px;color:var(--muted);margin-left:auto}
#speaker-notes{position:fixed;bottom:82px;left:clamp(14px,3vw,32px);right:clamp(14px,3vw,32px);z-index:10;padding:18px 22px;background:#071911f5;border:1px solid #c0d79466;box-shadow:0 12px 80px #0008;max-height:34vh;overflow:auto;font-size:15px;line-height:1.55}
#speaker-notes strong{color:var(--green)}#speaker-notes p{margin:8px 0 0;max-width:1100px}
#export-status{position:fixed;top:84px;right:20px;z-index:20;max-width:360px;font-size:13px;background:#10271f;padding:10px 14px;border:1px solid var(--line);display:none}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
@media(max-width:850px){.event{display:none}.toolbar{gap:14px}.tools{gap:5px}.tools button{padding:8px;font-size:11px}.two-col,.problem .two-col,.ai-layout{grid-template-columns:1fr}.field-visual{position:relative;display:block;right:auto;top:auto;width:min(100%,520px);margin:0 auto;opacity:.55}.caption{display:none}.hero .copy{padding-top:24px}.hero .field-visual{position:absolute;right:-14%;top:30%;width:70%;opacity:.35}.hero .copy{max-width:620px}.slide-footer{position:relative;left:auto;right:auto;bottom:auto;margin-top:28px}.benchmark .stats{gap:15px}.close .close-grid{gap:16px}}
@media(max-width:600px){.wordmark{font-size:18px}.wordmark span{font-size:9px}.tools button{font-size:0;padding:8px}.tools button::first-letter{font-size:13px}.toolbar{height:64px}.controls{height:auto;min-height:60px;gap:8px;flex-wrap:wrap}.hint{display:none}main{padding:8px}#stage{min-height:calc(100svh - 140px)}.slide{padding:24px 20px}.overline{margin-bottom:18px}.need-list{grid-template-columns:1fr 1fr;gap:14px}.need p{font-size:14px}.need b{font-size:17px}.rotation-grid{grid-template-columns:1fr;margin-top:25px}.rotation{min-height:155px}.rotation:nth-child(2),.rotation:nth-child(3){transform:none}.rotation h2{margin:13px 0 8px}.rotation p{font-size:15px}.mini-line{display:none}.evidence-grid{gap:15px}.step p{font-size:15px}.ai-stat{max-width:none;transform:none;padding:22px}.benchmark .stats{grid-template-columns:1fr;gap:18px}.stat p{max-width:100%;margin:7px 0 0}.close .close-grid{grid-template-columns:1fr}.actions a{font-size:13px}.authors{font-size:12px}.slide-footer{font-size:9px;flex-wrap:wrap}#speaker-notes{bottom:72px;left:10px;right:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{@page{size:13.333in 7.5in;margin:0}html,body{background:#10271f!important;overflow:visible!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}body{display:block}.toolbar,.controls,#speaker-notes,#export-status{display:none!important}main{display:block;padding:0}#stage{display:block;width:1280px;min-height:0;overflow:visible;box-shadow:none;border:0}.slide,.slide.active{display:block!important;position:relative!important;width:1280px;height:720px;min-height:720px;break-after:page;page-break-after:always;overflow:hidden;animation:none!important;padding:54px 62px}.slide:last-child{break-after:auto;page-break-after:auto}.slide-footer{position:absolute;left:62px;right:62px;bottom:20px}.field-visual{width:600px;position:absolute;right:20px;top:112px}.hero .field-visual{position:absolute}.slide-footer{margin:0}}
</style>

<script>
const LINKS={
 app:"https://soliq-delta.vercel.app/",
 ai:"https://soliq-delta.vercel.app/adviser/?lat=31.083333333333332&lon=30.933333333333334",
 benchmark:"https://soliq-delta.vercel.app/benchmarks/egypt-sakha/",
 paper:"https://soliq-delta.vercel.app/welcome/paper.html",
 github:"https://github.com/Mohamed-Mostafa-AE/SOLIQ"
};
const slides=[
{label:"01 / THE IDEA",title:"The next crop.\nA clearer choice.",lead:"NASA weather. Local knowledge.\nRotation decisions you can explain.",kind:"hero",tagline:"SOIL + WATER + CROP ROTATIONS",notes:"A rotation decision affects the whole farm: its water, soil, next planting window and market. Soil-IQ helps farmers explore three crop calendars under the same assumptions, while keeping the evidence and missing information visible. The field is a concept illustration, not a satellite image or a prediction of plant growth."},
{label:"02 / THE CHALLENGE",title:"One rotation.\nSeveral competing needs.",lead:"Farmers need to weigh the whole season.",kind:"problem",items:[["Water","Does the calendar fit the available supply?"],["Soil","Where could protective cover help?"],["Timing","Do crops fit the local growing window?"],["Feasibility","Are seed, equipment and markets available?"]],notes:"The challenge is choosing a feasible rotation as weather and water conditions change. A cover crop can protect soil, but it also uses water. A crop-family change needs local species and pest review. These trade-offs motivate a comparison tool grounded in the farmer’s situation. We do not infer field soil health from a satellite pixel."},
{label:"03 / THE SOLUTION",title:"Compare the season\nbefore changing the field.",lead:"Current calendar + two alternatives.\nOne shared weather and water context.",kind:"compare",items:[["01","Current calendar","Keep the farmer’s baseline visible."],["02","Alternative 1","Explore a different crop family or cover window."],["03","Alternative 2","Compare another seasonal demand pattern."]],notes:"The farmer edits three monthly crop calendars, provides soil-water information, water availability and practical constraints, and chooses a priority. We compare modeled storage and unmet water demand under shared weather. Unknown feasibility prevents a preferred-crop recommendation; an explicit refusal excludes an option from preference ordering. The displayed field changes are illustrative, not measured growth."},
{label:"04 / THE EVIDENCE",title:"Every result has\na source—and a limit.",lead:"Keep observations, assumptions\nand scenarios visible.",kind:"evidence",items:[["NASA POWER","Daily gridded temperature and rainfall; dated coverage and raw requests."],["Local context","Soil source, hydraulic properties, irrigation and crop calendars are declared inputs."],["Transparent calculation","Daily water accounting, historical weather scenarios and reproducible exports."]],notes:"NASA POWER is the live environmental adapter in this build. Its regional meteorology is not a field sensor. A simple single-layer water bucket uses declared capacity and crop coefficients; it does not model yield, profit, soil carbon, nutrient credits, salinity or groundwater. Other Earth-observation adapters and multi-year crop transitions remain future work. Present the paper as a methods draft."},
{label:"05 / THE AI DEMO",title:"Find the evidence\nbehind the answer.",lead:"An open model retrieves relevant guidance.\nThe report stays tied to NASA evidence.",kind:"ai",items:[["Runs on the device","A real embedding model; no paid inference key."],["Cites the guidance","Six reviewed source summaries, including FAO and NASA."],["Shows its scope","English / Arabic reports. No invented crop forecasts."]],stat:"5 / 5",statLabel:"predefined queries retrieved the expected source in the top three",notes:"The working AI demo uses all-MiniLM-L6-v2 to rank the relevance of reviewed source passages. The six-document corpus has English embeddings; preset questions are English, and reviewed guidance and deterministic reports are available in Arabic. Five hand-written English queries retrieved the expected source in their top three. This is a small retrieval diagnostic, not 100 percent agronomic accuracy. The numerical report is produced by rules and calculations. Free-form Kimi and DeepSeek generation still requires provider activation. Open the demo before judging to cache the model."},
{label:"06 / THE EGYPT BENCHMARK",title:"Real data.\nA real Egyptian context.",lead:"Sakha, Kafr El Sheikh · Nile Delta\nNASA weather: 1 Jan–12 Nov 2026",kind:"benchmark",items:[["316","valid daily records"],["48.14 mm","accumulated rainfall"],["112","days with maximum temperature ≥35°C"]],notes:"We chose an approximate Sakha study-area point, 31 degrees 5 minutes north and 30 degrees 56 minutes east, documented in a published wheat study. This is not a surveyed farm boundary or a claim of collaboration with Sakha. Fresh NASA responses were checked by a separate parser, retained with hashes and compared against the app. All 15 full-year strategy/member runs passed water accounting and bounds checks. The three calendars and soil parameters are illustrative assumptions. No independent 2026 station or farm outcomes were available. Source: doi:10.3389/fpls.2023.1165113 and Soil-IQ benchmark snapshot, 15 November 2026.\n\nForecast benchmark: Four retrospective chronological holdouts used target years 2022–2025 with only earlier years for training. The target was remaining-year rainfall after the November 12 cutoff. Analog rainfall MAE was 20.32 mm versus 15.29 mm for climatology, so no forecasting advantage was demonstrated. Both methods had zero heat-day error in a late-year period with no target days reaching 35 degrees C; that is a trivial result, not evidence of heat prediction skill. Numerical closure validates bookkeeping; field performance still needs independent measurements."},
{label:"07 / THE NEXT STEP",title:"Better questions.\nGrounded decisions.",lead:"Explore the app. Inspect the evidence.\nHelp us validate the next field pilot.",kind:"close",items:[["Validate","Independent weather, soil and irrigation measurements."],["Review","Local crop calendars and agronomist / farmer feedback."],["Extend","Multi-year rotations and justified satellite vegetation layers."]],notes:"Soil-IQ is a supportive decision tool. The next work is independent validation with local crop, soil and irrigation evidence, farmer usability review, and evaluation across locations and years. Our authors are Mohamed Mostafa, Youssef Mohamed, Aya Abdelnabi and Mohamed Abdelrahman. We are a NASA Space Apps 6 October project team. Badr University in Cairo is the event venue; we do not claim institutional affiliation or endorsement. The research paper remains a methods draft. Invite questions and show the live demo."}
];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function farmSVG(){return '<svg class="field-visual" viewBox="0 0 640 500" aria-hidden="true"><defs><linearGradient id="soilA" x2="0" y2="1"><stop stop-color="#82603a"/><stop offset="1" stop-color="#3e3024"/></linearGradient><linearGradient id="soilB" x2="1" y2="1"><stop stop-color="#5e482e"/><stop offset="1" stop-color="#322a21"/></linearGradient></defs><ellipse cx="320" cy="448" rx="238" ry="26" fill="#071912" opacity=".7"/><path d="M65 175 320 65 575 175 320 288Z" fill="#627946"/><path d="M65 175 320 288 320 365 65 252Z" fill="url(#soilA)"/><path d="M320 288 575 175 575 252 320 365Z" fill="url(#soilB)"/><path d="M65 175 320 288 575 175" fill="none" stroke="#b5cf8a" stroke-width="2" opacity=".5"/>'+Array.from({length:6},(_,i)=>{let y=188+i*13;return '<path d="M'+(90+i*3)+' '+y+' 320 '+(y+95)+' 550 '+(y-100)+'" fill="none" stroke="#c6ad76" stroke-width="2" opacity=".22"/>';}).join('')+Array.from({length:7},(_,r)=>Array.from({length:7},(_,c)=>{let x=105+c*34+r*22,y=180+c*15+r*7,h=28+(c%3)*8;return '<path d="M'+x+' '+y+' v-'+h+'" stroke="#9eb96b" stroke-width="3" stroke-linecap="round"/><path d="M'+x+' '+(y-h*.6)+' q-13 -13 -17 -3 q7 11 17 3 M'+x+' '+(y-h*.7)+' q13 -13 17 -3 q-7 11 -17 3" fill="#a9c477"/>';}).join('')).join('')+'<g transform="translate(460 54) rotate(-12)"><path d="M-48 18-14 8-10 35-44 44Z M15 1 49-9 53 18 19 28Z" fill="#4c8193" stroke="#a9c9bd" stroke-width="2"/><path d="M-14 8 3-1 19 1 23 30 7 39-10 35Z" fill="#c3cdb5"/><path d="M3-1 7 39 23 30 19 1Z" fill="#849784"/><path d="M0 3 0-15" stroke="#c7d8bc" stroke-width="2"/></g><path d="M468 105Q440 132 427 168" fill="none" stroke="#bed69b" stroke-dasharray="4 6" opacity=".4" stroke-width="2"/></svg>'}
function footer(i){return '<footer class="slide-footer"><span>SOIL-IQ / NASA SPACE APPS 6 OCTOBER</span><span>BUC: event venue · Working prototype · 15 NOV 2026</span><span>'+String(i+1).padStart(2,"0")+' / 07</span></footer>'}
function cards(items,cls){return '<div class="'+cls+'">'+items.map((it,i)=>'<article class="'+(cls==="rotation-grid"?"rotation":"step")+'">'+(cls==="rotation-grid"?'<small>CALENDAR '+esc(it[0])+'</small>':'')+(cls==="rotation-grid"?'<h2>'+esc(it[1])+'</h2><p>'+esc(it[2])+'</p><div class="mini-line">'+Array.from({length:12},()=>"<i></i>").join("")+'</div>':'<h2>'+esc(it[0])+'</h2><p>'+esc(it[1])+'</p>')+'</article>').join("")+'</div>'}
function render(s,i){
 let body="";
 if(s.kind==="hero")body='<div class="copy"><p class="overline">'+esc(s.label)+'</p><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.lead)+'</p><span class="tagline">'+esc(s.tagline)+'</span></div>'+farmSVG()+'<p class="caption">3D CONCEPT ILLUSTRATION</p>';
 if(s.kind==="problem")body='<div class="two-col"><div><p class="overline">'+esc(s.label)+'</p><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.lead)+'</p><div class="need-list">'+s.items.map(it=>'<div class="need"><b>'+esc(it[0])+'</b><p>'+esc(it[1])+'</p></div>').join("")+'</div></div>'+farmSVG()+'</div>';
 if(s.kind==="compare")body='<div class="section-head"><p class="overline">'+esc(s.label)+'</p><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.lead)+'</p></div>'+cards(s.items,"rotation-grid")+'<p class="aside-line">Local checks determine eligibility. Unknown suitability keeps the preference order unresolved.</p>';
 if(s.kind==="evidence")body='<div class="two-col"><div><p class="overline">'+esc(s.label)+'</p><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.lead)+'</p>'+cards(s.items,"evidence-grid")+'</div>'+farmSVG()+'</div>';
 if(s.kind==="ai")body='<div class="ai-layout"><div><p class="overline">'+esc(s.label)+'</p><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.lead)+'</p>'+cards(s.items,"evidence-grid")+'<a class="text-link" href="'+LINKS.ai+'" target="_blank" rel="noopener">Open the live AI demo ↗</a></div><aside class="ai-stat"><strong>'+esc(s.stat)+'</strong><p>'+esc(s.statLabel)+'</p><small>Small, hand-written English retrieval test on six reviewed passages. Not general agronomic accuracy.</small></aside></div>';

 if(s.kind==="close")body='<div><p class="overline">'+esc(s.label)+'</p><h1>'+esc(s.title)+'</h1><p class="lead">'+esc(s.lead)+'</p>'+cards(s.items,"close-grid")+'<div class="actions"><a class="primary" href="'+LINKS.app+'" target="_blank" rel="noopener">Explore the live project ↗</a><a href="'+LINKS.ai+'" target="_blank" rel="noopener">Launch AI demo ↗</a><a href="'+LINKS.benchmark+'" target="_blank" rel="noopener">Read benchmark ↗</a><a href="'+LINKS.paper+'" target="_blank" rel="noopener">Research brief · draft ↗</a><a href="'+LINKS.github+'" target="_blank" rel="noopener">GitHub ↗</a></div><p class="authors">Mohamed Mostafa · Youssef Mohamed · Aya Abdelnabi · Mohamed Abdelrahman<br>NASA Space Apps 6 October team · Event venue: Badr University in Cairo</p></div>'+farmSVG();
 return '<section class="slide '+s.kind+'" id="slide-'+(i+1)+'" aria-label="Slide '+(i+1)+': '+esc(s.title.replaceAll("\n"," "))+'" aria-hidden="true">'+body+footer(i)+'</section>'

const stage=$("#stage"),nav=$("#slide-nav");
slides.forEach((s,i)=>{stage.insertAdjacentHTML("beforeend",render(s,i));const b=document.createElement("button");b.textContent=i+1;b.setAttribute("aria-label","Show slide "+(i+1));b.setAttribute("aria-pressed","false");b.addEventListener("click",()=>show(i));nav.append(b)});
let current=Math.max(0,Math.min(slides.length-1,Number(location.hash.slice(1))-1||0));
function show(index){current=Math.max(0,Math.min(slides.length-1,index));stage.querySelectorAll(".slide").forEach((el,i)=>{el.classList.toggle("active",i===current);el.setAttribute("aria-hidden",String(i!==current))});nav.querySelectorAll("button").forEach((b,i)=>b.setAttribute("aria-pressed",String(i===current)));$("#counter").textContent=(current+1)+" / "+slides.length;$("#previous").disabled=current===0;$("#next").disabled=current===slides.length-1;$("#speaker-notes p").textContent=slides[current].notes;history.replaceState(null,"","#"+(current+1));}
function toggleNotes(){const box=$("#speaker-notes");box.hidden=!box.hidden;$("#notes-toggle").setAttribute("aria-pressed",String(!box.hidden))}
$("#previous").addEventListener("click",()=>show(current-1));$("#next").addEventListener("click",()=>show(current+1));$("#notes-toggle").addEventListener("click",toggleNotes);$("#print-deck").addEventListener("click",()=>window.print());
$("#fullscreen").addEventListener("click",async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notice("Full screen is unavailable in this browser. Use the browser’s full-screen command.")}});
document.addEventListener("keydown",e=>{if(e.target.closest("button,a,input,textarea,select")&&e.key===" ")return;if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();show(current+1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==="Home")show(0);if(e.key==="End")show(slides.length-1);if(e.key.toLowerCase()==="n")toggleNotes();if(e.key.toLowerCase()==="f")$("#fullscreen").click()});
function notice(message){const el=$("#export-status");el.textContent=message;el.style.display="block";clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.style.display="none",6000)}
let pptxPromise;
function loadPptx(){if(window.PptxGenJS)return Promise.resolve(window.PptxGenJS);if(!pptxPromise)pptxPromise=new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js";s.onload=()=>window.PptxGenJS?resolve(window.PptxGenJS):reject(Error("PowerPoint library did not initialize."));s.onerror=()=>reject(Error("Could not load the PowerPoint library."));document.head.append(s)});return pptxPromise}
async function exportPowerPoint(){const btn=$("#export-pptx");btn.disabled=true;notice("Preparing the seven-slide PowerPoint with speaker notes…");try{const PptxGenJS=await loadPptx(),pptx=new PptxGenJS();pptx.layout="LAYOUT_WIDE";pptx.author="Mohamed Mostafa; Youssef Mohamed; Aya Abdelnabi; Mohamed Abdelrahman";pptx.subject="NASA Space Apps crop-rotation decision support";pptx.title="Soil-IQ | 3D Pitch";pptx.lang="en-US";const add=(sl,t,x,y,w,h,sz=20,col="EFF3E4",extra={})=>sl.addText(t,{x,y,w,h,fontFace:"Arial",fontSize:sz,color:col,margin:0,breakLine:false,valign:"top",fit:"shrink",...extra});for(let i=0;i<slides.length;i++){const s=slides[i],sl=pptx.addSlide();sl.background={color:"10271F"};add(sl,s.label.toUpperCase(),.65,.4,11.8,.3,10,"C0D794",{charSpacing:2});add(sl,s.title,.65,.95,11.7,1.5,s.kind==="hero"?42:34,"EFF3E4",{fontFace:"Georgia"});add(sl,s.lead,.65,2.45,11.5,.75,16,"C7D0C0");if(s.items){const y=3.55;if(s.kind==="compare"){s.items.forEach((it,j)=>{const x=.65+j*4.05;sl.addShape(pptx.ShapeType.rect,{x,y,w:3.75,h:2.15,fill:{color:"193328"},line:{color:"688455",width:1}});add(sl,"CALENDAR "+it[0],x+.2,y+.25,3.3,.25,10,"D6AD64");add(sl,it[1],x+.2,y+.7,3.3,.55,19);add(sl,it[2],x+.2,y+1.3,3.25,.65,14,"C7D0C0")})}else if(s.kind==="benchmark"){s.items.forEach((it,j)=>{const x=.65+j*3.5;add(sl,it[0],x,3.5,3.15,.65,32);add(sl,it[1],x,4.25,3.15,.8,14,"C7D0C0")});add(sl,"15 scenario runs passed water-balance checks.\nRainfall MAE: analogs 20.32 mm; climatology 15.29 mm.\nAnalogs were worse; farm outcomes remain unvalidated.",.65,5.3,9,.8,12,"C0D794")}else{s.items.forEach((it,j)=>{const horizontal=s.kind==="close",x=horizontal?.65+j*3.9:.65,y=horizontal?3.7:3.45+j*.85,w=horizontal?3.5:8.7;add(sl,it[0],x,y,w,.3,16,"C0D794");add(sl,it[1],x,y+.35,w,horizontal?.75:.45,13,"C7D0C0")})}}if(s.kind==="ai"){add(sl,"5 / 5",9,3.6,2.7,.8,42,"C0D794",{fontFace:"Georgia"});add(sl,"Expected source in top three",9,4.45,2.8,.8,15)}if(s.kind==="close"){add(sl,"Mohamed Mostafa · Youssef Mohamed · Aya Abdelnabi · Mohamed Abdelrahman",.65,6.15,10,.3,11,"C7D0C0");sl.addText("OPEN LIVE PROJECT ↗",{x:.65,y:5.75,w:3,h:.25,fontSize:11,color:"C0D794",hyperlink:{url:LINKS.app},margin:0})}add(sl,"SOIL-IQ · NASA SPACE APPS 6 OCTOBER",.65,7.15,9,.15,8,"AABB9F");add(sl,String(i+1).padStart(2,"0")+" / 07",12.1,7.15,.6,.15,8,"AABB9F");if(typeof sl.addNotes==="function")sl.addNotes(s.notes+"\n\nLive evidence: "+LINKS.benchmark+" ; "+LINKS.github)}const blob=await pptx.write({outputType:"blob"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Soil-IQ_Seven_Slide_Pitch.pptx";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);notice("PowerPoint downloaded.")}catch(err){notice("PowerPoint export failed: "+err.message+". Print / PDF is still available.")}finally{btn.disabled=false}}
$("#export-pptx").addEventListener("click",exportPowerPoint);
show(current);
