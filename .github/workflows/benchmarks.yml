name: Soliq tests and benchmarks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Numerical checks and reproducible benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run automated tests
        run: npm test
      - name: Run benchmark matrix
        run: npm run benchmark
      - name: Check application syntax
        run: node --check app.js
      - name: Preserve benchmark outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soliq-benchmarks-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  browser:
    name: English and Arabic browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.65.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test crop workflows and both languages
        run: npx playwright test
      - name: Preserve browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soliq-browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 90


  live-nasa:
    name: Live 2026 NASA coverage and scenario check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Retrieve real NASA data and check the 2026 pipeline
        run: node outlook-benchmark.mjs
      - name: Preserve dated evidence and hindcast report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soliq-nasa-2026-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
