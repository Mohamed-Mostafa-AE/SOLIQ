<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10271f">
  <title>Soil-IQ — 3D Pitch</title>
  <link rel="icon" type="image/png" href="../soil-iq-logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#viewport">Skip to presentation</a>
  <header class="toolbar">
    <a href="../welcome/" class="wordmark" aria-label="Soil-IQ home"><img src="../soil-iq-logo.png" alt="Soil-IQ"></a>
    <span class="event">NASA SPACE APPS / 6 OCTOBER</span>
    <div class="tools">
      <button id="notes-toggle" aria-pressed="false">Notes <kbd>N</kbd></button>
      <button id="export-pptx">PowerPoint ↓</button>
      <button id="print-deck">Print / PDF</button>
      <button id="fullscreen">Full screen <kbd>F</kbd></button>
    </div>
  </header>
  <main id="viewport" aria-label="Soil-IQ presentation" tabindex="-1"><div id="stage"></div></main>
  <aside id="speaker-notes" aria-label="Speaker notes" hidden>
    <strong>Speaker notes</strong>
    <button id="close-notes" aria-label="Close speaker notes">Close notes</button>
    <p></p>
  </aside>
  <footer class="controls">
    <button id="previous" aria-label="Previous slide">←</button>
    <div id="slide-nav" role="group" aria-label="Choose a slide"></div>
    <span id="counter" aria-live="polite"></span>
    <button id="next" aria-label="Next slide">→</button>
    <span class="hint">← → to navigate · 3D fields are concept illustrations</span>
  </footer>
  <p id="slide-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <p id="export-status" role="status"></p>
  <script type="module" src="app.js"></script>
</body>
</html>
