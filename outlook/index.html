<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10261f"><title>Soliq · 2026 Living Farm</title><link rel="stylesheet" href="../outlook.css"><style>body{margin:0;background:#091b15;color:#eaf0e8;font:14px system-ui,sans-serif}.outlook-nav{max-width:1200px;margin:auto;padding:24px;display:flex;gap:25px;align-items:center}.outlook-nav a{color:inherit;text-decoration:none}.outlook-nav strong{letter-spacing:3px}.outlook-nav button{margin-inline-start:auto;background:none;color:#eaf0e8;border:1px solid #9abd8b77;padding:10px;cursor:pointer}main{max-width:1200px;margin:0 auto 40px}.living-workspace{border:0}@media(max-width:600px){.outlook-nav{font-size:12px;gap:15px}}</style></head><body><nav class="outlook-nav"><a href="../welcome/"><strong>SOLIQ</strong></a><a href="../#analyzer">Crop workspace ↗</a><button id="lang" lang="ar">العربية</button></nav><main id="outlook"></main><script type="module">import {mountOutlook} from '../outlook-view.js';let lang='en',config={};try{lang=JSON.parse(localStorage.getItem('soliq-display-v1'))?.language||'en';config=JSON.parse(localStorage.getItem('fieldshift-project-v1'))?.config||{};}catch{}let cleanup;function show(){cleanup?.();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelector('#lang').textContent=lang==='ar'?'English':'العربية';cleanup=mountOutlook(document.querySelector('#outlook'),{language:lang,config});}document.querySelector('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';show();};show();</script></body></html>
